<script>

/* =========================
   USER DATA
========================= */

let currentPhone = "";
let coins = 100;
let joined = false;


/* =========================
   GET USER KEY
========================= */

function getUserKey(phone){

  return "prince_user_" + phone;

}


/* =========================
   LOAD USER DATA
========================= */

function loadUser(phone){

  let key = getUserKey(phone);

  let savedData =
    localStorage.getItem(key);

  if(savedData){

    let data =
      JSON.parse(savedData);

    coins =
      Number(data.coins ?? 100);

    joined =
      Boolean(data.joined);

  }else{

    coins = 100;
    joined = false;

  }

}


/* =========================
   SAVE USER DATA
========================= */

function saveUser(){

  if(!currentPhone){
    return;
  }

  let key =
    getUserKey(currentPhone);

  let oldData =
    localStorage.getItem(key);

  let oldUser =
    oldData ? JSON.parse(oldData) : {};

  let data = {

    password: oldUser.password || "",
    coins: coins,
    joined: joined

  };

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

}


/* =========================
   LOGIN
========================= */

function loginUser(){

  let phone =
    document.getElementById("phone").value.trim();

  let password =
    document.getElementById("password").value;

  if(phone.length !== 10){

    alert("कृपया 10 अंकों का मोबाइल नंबर डालें।");
    return;

  }

  if(password.length < 4){

    alert("पासवर्ड कम से कम 4 characters का रखें।");
    return;

  }


  /* उसी फोन नंबर का account */

  let key =
    getUserKey(phone);

  let savedData =
    localStorage.getItem(key);


  /*
     पहली बार इस नंबर से login हो रहा है
     तो password save होगा
  */

  if(!savedData){

    let newUser = {

      password: password,
      coins: 100,
      joined: false

    };

    localStorage.setItem(
      key,
      JSON.stringify(newUser)
    );

  }else{

    let data =
      JSON.parse(savedData);


    /*
       वही password होना जरूरी है
    */

    if(data.password !== password){

      alert("गलत Password है। इसी Account का Password डालें।");
      return;

    }

  }


  /* Current user set */

  currentPhone = phone;


  /* User data load */

  loadUser(phone);


  /* Main App खोलें */

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  document
    .getElementById("profilePhone")
    .innerText = phone;


  updateCoins();


  if(joined){

    showBattle();

  }

}


/* =========================
   PAGES
========================= */

function showPage(page){

  document
    .getElementById("homePage")
    .classList.add("hidden");

  document
    .getElementById("tournamentPage")
    .classList.add("hidden");

  document
    .getElementById("walletPage")
    .classList.add("hidden");

  document
    .getElementById("profilePage")
    .classList.add("hidden");


  document
    .getElementById("navHome")
    .classList.remove("active");

  document
    .getElementById("navTournament")
    .classList.remove("active");

  document
    .getElementById("navWallet")
    .classList.remove("active");

  document
    .getElementById("navProfile")
    .classList.remove("active");


  if(page === "home"){

    document
      .getElementById("homePage")
      .classList.remove("hidden");

    document
      .getElementById("navHome")
      .classList.add("active");

  }


  if(page === "tournament"){

    document
      .getElementById("tournamentPage")
      .classList.remove("hidden");

    document
      .getElementById("navTournament")
      .classList.add("active");

  }


  if(page === "wallet"){

    document
      .getElementById("walletPage")
      .classList.remove("hidden");

    document
      .getElementById("navWallet")
      .classList.add("active");

  }


  if(page === "profile"){

    document
      .getElementById("profilePage")
      .classList.remove("hidden");

    document
      .getElementById("navProfile")
      .classList.add("active");

  }

}


/* =========================
   JOIN
========================= */

function openJoin(){

  document
    .getElementById("joinCoins")
    .innerText = coins;

  document
    .getElementById("joinModal")
    .classList.remove("hidden");

}


function closeModal(){

  document
    .getElementById("joinModal")
    .classList.add("hidden");

}


function confirmJoin(){

  if(coins < 20){

    alert("आपके पास 20 Coins नहीं हैं।");

    closeModal();

    return;

  }

  coins -= 20;

  joined = true;

  saveUser();

  updateCoins();

  closeModal();

  showBattle();

  alert(
    "1v1 Custom में Join हो गया!\n\n" +
    "20 Coins काटे गए।\n" +
    "बाकी Balance: " +
    coins +
    " Coins"
  );

}


/* =========================
   BATTLE
========================= */

function showBattle(){

  document
    .getElementById("myBattle")
    .innerHTML = `

      <div class="gameCard">

        <div class="gameTop">

          <div class="gameName">
            ⚔️ 1v1 Custom
          </div>

          <div class="badge">
            JOINED
          </div>

        </div>

        <p class="sub">
          आपका Battle successfully join हो गया है।
        </p>

        <div class="roomBox">

          <b>🎮 Room Details</b>

          <div class="roomRow">

            <div class="roomLabel">
              Room ID
            </div>

            <div class="roomValue">
              अभी उपलब्ध नहीं
            </div>

          </div>

          <div class="roomRow">

            <div class="roomLabel">
              Password
            </div>

            <div class="roomValue">
              अभी उपलब्ध नहीं
            </div>

          </div>

        </div>

        <div class="notice">

          Room ID और Password admin द्वारा
          match शुरू होने से पहले दिया जाएगा।

        </div>

      </div>

    `;

}


/* =========================
   COINS
========================= */

function updateCoins(){

  document
    .getElementById("topCoins")
    .innerText = coins;

  document
    .getElementById("walletCoins")
    .innerText = coins;

  document
    .getElementById("profileCoins")
    .innerText = coins;

}


/* =========================
   FREE COINS
========================= */

function freeCoins(){

  coins += 10;

  saveUser();

  updateCoins();

  alert(
    "🎁 आपको 10 Free Coins मिले!\n\n" +
    "अब Balance: " +
    coins +
    " Coins"
  );

}


/* =========================
   LOGOUT
========================= */

function logoutUser(){

  saveUser();

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("password")
    .value = "";

  document
    .getElementById("phone")
    .value = "";

  currentPhone = "";

}


/* =========================
   TIMER
========================= */

let seconds = 600;

setInterval(function(){

  let min =
    Math.floor(seconds / 60);

  let sec =
    seconds % 60;

  if(sec < 10){
    sec = "0" + sec;
  }

  document
    .getElementById("timer")
    .innerText =
      min + ":" + sec;

  if(seconds > 0){
    seconds--;
  }

},1000);

</script>
