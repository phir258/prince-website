<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Battle Tournament</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(135deg,#080b18,#172554);
  color:white;
  min-height:100vh;
}

.container{
  max-width:450px;
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:25px 0;
  color:#ffd700;
}

.card{
  background:#111827;
  border:1px solid #334155;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px #0008;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:white;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#f59e0b;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.02);
}

.hidden{
  display:none;
}

.title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.tournament{
  border:1px solid #374151;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
  background:#0f172a;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  color:#cbd5e1;
}

.badge{
  display:inline-block;
  background:#16a34a;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
}

.note{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">👑 PRINCE BATTLE</div>

  <!-- LOGIN -->
  <div id="loginPage" class="card">

    <div class="title">🔐 Login</div>

    <input id="phone" type="tel" placeholder="Mobile Number">

    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p class="note">
      Demo login — कोई वास्तविक OTP/payment नहीं।
    </p>

  </div>


  <!-- HOME -->
  <div id="homePage" class="hidden">

    <div class="card">
      <div class="title">🏠 Welcome Prince</div>

      <div class="row">
        <span>Wallet</span>
        <strong>₹0</strong>
      </div>

      <button onclick="showTournament()">🏆 Tournaments</button>
      <button onclick="logout()">Logout</button>
    </div>


    <div id="tournamentPage" class="card hidden">

      <div class="title">🏆 Live Tournament</div>

      <div class="tournament">

        <span class="badge">LIVE</span>

        <h3 style="margin-top:10px;">
          Free Fire 1 VS 1
        </h3>

        <div class="row">
          <span>Entry Fee</span>
          <strong>₹20</strong>
        </div>

        <div class="row">
          <span>Winning</span>
          <strong>₹18</strong>
        </div>

        <div class="row">
          <span>Time</span>
          <strong>7:30 AM - 7:30 PM</strong>
        </div>

        <button onclick="joinTournament()">
          JOIN TOURNAMENT
        </button>

      </div>

      <p id="message" class="note"></p>

    </div>

  </div>

</div>


<script>

function login(){

  let phone = document.getElementById("phone").value;
  let password = document.getElementById("password").value;

  if(phone === "" || password === ""){
    alert("Mobile Number और Password डालें");
    return;
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("homePage").classList.remove("hidden");

}


function showTournament(){

  document.getElementById("tournamentPage")
  .classList.remove("hidden");

}


function joinTournament(){

  document.getElementById("message").innerText =
  "Demo: Tournament join button दबाया गया। Real payment नहीं किया गया।";

}


function logout(){

  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");

}

</script>

</body>
</html>
