<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prince Wallet</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:92%;
  max-width:400px;
}

.card{
  background:white;
  padding:30px 22px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,0.12);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.error{
  color:red;
  text-align:center;
  margin-top:12px;
}

#wallet{
  display:none;
}

.bonus{
  background:#f1f5ff;
  padding:20px;
  border-radius:14px;
  text-align:center;
  margin:20px 0;
}

.bonus h2{
  color:#2563eb;
}

.balance{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.demo{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN PAGE -->
  <div class="card" id="login">

    <div class="logo">PRINCE</div>

    <div class="subtitle">
      Welcome to Prince Wallet
    </div>

    <label>Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="Enter phone number"
      maxlength="10"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button onclick="loginUser()">
      Login
    </button>

    <div class="error" id="error"></div>

  </div>


  <!-- WALLET PAGE -->
  <div class="card" id="wallet">

    <div class="logo">PRINCE WALLET</div>

    <div class="bonus">
      <div>🎁 WELCOME BONUS</div>
      <h2>₹300</h2>

      <div class="balance" id="balance">
        ₹300
      </div>
    </div>

    <button onclick="demoDeposit()">
      💰 Deposit
    </button>

    <button onclick="withdraw()">
      💸 Withdrawal
    </button>

    <div class="demo">
      DEMO VERSION — Real money transaction is not enabled.
    </div>

  </div>

</div>


<script>

let balance = 300;

function loginUser(){

  let phone = document.getElementById("phone").value;
  let password = document.getElementById("password").value;
  let error = document.getElementById("error");

  if(phone.length !== 10){
    error.innerText = "सही 10 digit phone number डालें";
    return;
  }

  if(password.length < 4){
    error.innerText = "Password कम से कम 4 characters का होना चाहिए";
    return;
  }

  error.innerText = "";

  document.getElementById("login").style.display = "none";
  document.getElementById("wallet").style.display = "block";
}


function demoDeposit(){

  balance += 100;

  document.getElementById("balance").innerText =
    "₹" + balance;

  alert("Demo Deposit सफल हुआ। ₹100 balance में जोड़ा गया।");
}


function withdraw(){

  alert("Withdrawal केवल demo है। Real money withdrawal उपलब्ध नहीं है।");
}

</script>

</body>
</html>
