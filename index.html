<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prince Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      text-align: center;
    }

    .box {
      padding: 80px 20px;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
    }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: #2563eb;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>👑 PRINCE</h1>
    <p>Welcome to my first website 🚀</p>
    <p>Gaming • AI • Technology</p>

    <button onclick="alert('Welcome to Prince Website! 👑')">
      Click Me
    </button>
  </div>

</body>
  </html>
