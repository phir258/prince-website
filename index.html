<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prince Battle Ground</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      text-align: center;
    }

    .header {
      padding: 25px 15px;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .profile {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
    }

    .container {
      padding: 25px 15px;
    }

    .card {
      background: #151d32;
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="IMG-20260902-WA0000.jpg" class="profile">
    <h1>PRINCE BATTLE GROUND</h1>
    <p>Gaming Tournament App</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>🏆 Tournament</h2>
      <p>Battle Ground Tournament में आपका स्वागत है।</p>
      <button onclick="showPage('tournament')">Tournament खोलें</button>
    </div>

    <div class="card">
      <h2>👤 Profile</h2>
      <button onclick="showPage('profile')">Profile खोलें</button>
    </div>

    <div class="card">
      <h2>📞 Contact</h2>
      <button onclick="showPage('contact')">Contact खोलें</button>
    </div>

    <div id="tournament" class="card hidden">
      <h2>🏆 Tournament</h2>
      <p>यहाँ आगे Tournament की जानकारी और Join विकल्प जोड़े जाएंगे।</p>
      <button onclick="goHome()"> वापस Home</button>
    </div>

    <div id="profile" class="card hidden">
      <h2>👤 Profile</h2>
      <p>Prince Battle Ground</p>
      <button onclick="goHome()">वापस Home</button>
    </div>

    <div id="contact" class="card hidden">
      <h2>📞 Contact</h2>
      <p>Contact details यहाँ बाद में जोड़ेंगे।</p>
      <button onclick="goHome()">वापस Home</button>
    </div>

  </div>

  <script>
    function showPage(page) {
      document.querySelectorAll('.card').forEach(card => {
        if (card.id) card.classList.add('hidden');
      });

      document.getElementById(page).classList.remove('hidden');
      window.scrollTo(0, document.getElementById(page).offsetTop);
    }

    function goHome() {
      document.querySelectorAll('.card').forEach(card => {
        if (card.id) card.classList.add('hidden');
      });

      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
