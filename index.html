<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <title>Prince Battle Ground</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#080b14,#172554);
      color:white;
      min-height:100vh;
    }
    .container{max-width:430px;margin:auto;padding:25px 18px}
    .logo{text-align:center;font-size:30px;font-weight:bold;margin:20px 0}
    .card{
      background:#111827;
      border:1px solid #334155;
      border-radius:18px;
      padding:22px;
      margin-top:18px;
      box-shadow:0 10px 30px #0005;
    }
    h2{text-align:center;margin-bottom:20px}
    input{
      width:100%;
      padding:14px;
      margin:8px 0;
      border:0;
      border-radius:10px;
      outline:none;
    }
    button{
      width:100%;
      padding:14px;
      margin-top:12px;
      border:0;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }
    .login{background:#2563eb;color:white}
    .deposit{background:#16a34a;color:white}
    .withdraw{background:#dc2626;color:white}
    .install{background:#f59e0b;color:#111}
    .hidden{display:none}
    .bonus{
      text-align:center;
      padding:20px;
      background:#1e293b;
      border-radius:15px;
      margin:15px 0;
    }
    .bonus strong{font-size:30px;color:#fbbf24}
    .message{
      text-align:center;
      margin-top:15px;
      color:#fbbf24;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="logo">👑 PRINCE BATTLE GROUND</div>

  <!-- LOGIN -->
  <div id="loginPage" class="card">
    <h2>Login</h2>

    <input id="phone" type="tel" placeholder="Phone Number">
    <input id="password" type="password" placeholder="Password">

    <button class="login" onclick="login()">LOGIN</button>

    <div id="loginMsg" class="message"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <h2>🎉 Welcome User</h2>

      <div class="bonus">
        <div>Welcome Bonus</div>
        <strong>₹300</strong>
      </div>

      <button class="deposit" onclick="demo('Deposit')">
        💰 Deposit
      </button>

      <button class="withdraw" onclick="demo('Withdrawal')">
        💸 Withdrawal
      </button>

      <button id="installBtn" class="install hidden">
        📲 Install App
      </button>

      <div id="actionMsg" class="message"></div>
    </div>

  </div>

</div>

<script>
function login(){
  const phone=document.getElementById("phone").value;
  const password=document.getElementById("password").value;

  if(phone.length < 10 || password.length < 4){
    document.getElementById("loginMsg").innerText =
      "Phone number और password सही से डालें";
    return;
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
}

function demo(action){
  document.getElementById("actionMsg").innerText =
    action + " Demo Option Opened";
}

/* PWA Install */
let deferredPrompt;
const installBtn=document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.classList.remove("hidden");
});

installBtn.addEventListener("click",async()=>{
  if(!deferredPrompt)return;

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.classList.add("hidden");
});

/* Service Worker */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
