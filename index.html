<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prince Demo Wallet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b14;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:92%;
  max-width:400px;
  background:#151a27;
  padding:25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px #000;
}

h1{
  color:#00eaff;
  margin-bottom:8px;
}

.demo{
  background:#ffb000;
  color:#111;
  padding:7px;
  border-radius:8px;
  font-weight:bold;
  margin-bottom:20px;
}

.balance{
  font-size:28px;
  margin:20px 0;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.deposit{
  background:#00d084;
  color:white;
}

.withdraw{
  background:#ff4757;
  color:white;
}

#message{
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:#242b3d;
  display:none;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

  <h1>PRINCE WALLET</h1>

  <div class="demo">
    DEMO — असली पैसे का लेन-देन नहीं
  </div>

  <div class="balance">
    Demo Balance: ₹300
  </div>

  <button class="deposit" onclick="deposit()">
    💰 Deposit
  </button>

  <button class="withdraw" onclick="withdraw()">
    💸 Withdrawal
  </button>

  <div id="message"></div>

</div>

<script>

let deposited = false;

function deposit(){

  deposited = true;

  document.getElementById("message").style.display = "block";

  document.getElementById("message").innerHTML =
  "✅ Demo Deposit सफल हुआ।<br><br>" +
  "अब Demo Withdrawal option उपलब्ध है।";

}

function withdraw(){

  document.getElementById("message").style.display = "block";

  if(!deposited){

    document.getElementById("message").innerHTML =
    "⚠️ पहले Demo Deposit करें।<br><br>" +
    "Withdrawal शुरू करने के लिए पहले Demo Deposit पूरा करें।<br><br>" +
    "<b>DEMO — कोई असली पैसा नहीं।</b>";

  }else{

    document.getElementById("message").innerHTML =
    "✅ Demo Withdrawal option खुल गया।<br><br>" +
    "यह केवल Demo है। असली पैसे का withdrawal नहीं होता।";

  }

}

</script>

</body>
</html>
