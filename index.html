<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prince Battle Ground</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#080b14;
  color:white;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:linear-gradient(180deg,#10182d,#080b14);
}

header{
  padding:22px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111827;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#ffd000;
}

.login-btn{
  background:#2563eb;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:20px;
}

.hero{
  padding:30px 20px;
  text-align:center;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#b8c0d4;
  line-height:1.5;
}

.card{
  margin:15px;
  padding:20px;
  border-radius:18px;
  background:#151d31;
  border:1px solid #273452;
}

.card h2{
  margin-bottom:10px;
}

.info{
  display:flex;
  justify-content:space-between;
  margin:12px 0;
  color:#cbd5e1;
}

.join{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.timer{
  color:#ffd000;
  font-weight:bold;
}

section{
  padding-bottom:20px;
}

footer{
  text-align:center;
  padding:25px;
  color:#718096;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">👑 PRINCE</div>
  <button class="login-btn" onclick="login()">Login</button>
</header>

<section class="hero">
  <h1>🎮 Prince Battle Ground</h1>
  <p>Free Fire Tournament Platform</p>
</section>

<section>

<div class="card">
  <h2>🏆 Daily Battle</h2>

  <div class="info">
    <span>Players</span>
    <span>48/50</span>
  </div>

  <div class="info">
    <span>Entry</span>
    <span>Demo</span>
  </div>

  <div class="info">
    <span>Starts In</span>
    <span class="timer" id="timer1">10:00</span>
  </div>

  <button class="join" onclick="joinTournament()">
    Join Tournament
  </button>
</div>

<div class="card">
  <h2>🔥 Coming Soon</h2>

  <div class="info">
    <span>New Tournament</span>
    <span>Coming Soon</span>
  </div>

  <button class="join" onclick="details()">
    View Details
  </button>
</div>

</section>

<footer>
  © 2026 Prince Battle Ground
</footer>

</div>

<script>

function login(){
  alert("Login/Register system अगले step में जोड़ा जाएगा।");
}

function joinTournament(){
  alert("Tournament Join Demo सफल हुआ!");
}

function details(){
  alert("Tournament details जल्द उपलब्ध होंगे।");
}

let seconds = 600;

setInterval(function(){

  let min = Math.floor(seconds / 60);
  let sec = seconds % 60;

  document.getElementById("timer1").innerText =
    String(min).padStart(2,"0") + ":" +
    String(sec).padStart(2,"0");

  if(seconds > 0){
    seconds--;
  }

},1000);

</script>

</body>
</html>
