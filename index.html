<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Wallet Demo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b14;
  color:white;
  min-height:100vh;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin:15px 0 25px;
  color:#00e5ff;
}

.card{
  background:#121827;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.balance{
  text-align:center;
  font-size:36px;
  font-weight:bold;
  color:#00ff9d;
  margin:10px 0;
}

.bonus{
  text-align:center;
  color:#ffd54a;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.deposit{
  background:#00c853;
  color:white;
}

.withdraw{
  background:#ff1744;
  color:white;
}

button:active{
  transform:scale(.98);
}

.info{
  text-align:center;
  color:#aeb7c7;
  font-size:13px;
  margin-top:18px;
  line-height:1.5;
}

.upi{
  display:none;
  margin-top:15px;
  background:#202a3d;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #45516a;
  background:#0c111d;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">👑 PRINCE WALLET</div>

  <div class="card">
    <h3>Welcome Bonus 🎁</h3>

    <div class="balance" id="balance">₹300</div>

    <div class="bonus">
      ₹300 Demo Bonus
    </div>

    <button class="deposit" onclick="showDeposit()">
      💰 Deposit
    </button>

    <button class="withdraw" onclick="withdrawDemo()">
      💳 Withdrawal
    </button>

    <div class="upi" id="depositBox">
      <b>Demo Deposit</b>

      <p style="margin-top:10px;">
        यह केवल Demo है। असली payment उपलब्ध नहीं है।
      </p>

      <input
        type="number"
        id="amount"
        placeholder="Demo amount डालें"
      >

      <button class="deposit" onclick="demoDeposit()">
        Add Demo Balance
      </button>
    </div>
  </div>

  <div class="card">
    <h3>Account</h3>

    <p style="margin-top:12px;">
      📱 Mobile: Demo User
    </p>

    <p style="margin-top:10px;">
      🟢 Account Status: Active
    </p>
  </div>

  <div class="info">
    ⚠️ यह Demo Wallet है।<br>
    इसमें कोई वास्तविक धन, UPI payment या withdrawal नहीं होता।
  </div>

</div>

<script>

let balance = 300;

function showDeposit(){
  document.getElementById("depositBox").style.display = "block";
}

function demoDeposit(){

  let amount = Number(document.getElementById("amount").value);

  if(amount <= 0){
    alert("Demo amount डालें");
    return;
  }

  balance += amount;

  document.getElementById("balance").innerText =
    "₹" + balance;

  document.getElementById("amount").value = "";

  alert("Demo balance successfully added!");
}

function withdrawDemo(){

  alert(
    "Withdrawal अभी उपलब्ध नहीं है। यह केवल Demo Wallet है।"
  );

}

</script>

</body>
</html>
